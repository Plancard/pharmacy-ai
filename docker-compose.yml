# 1차 실행: docker compose up --build  →  http://localhost:5000
# 값은 루트 .env에서 읽는다 (POSTGRES_PASSWORD는 영문·숫자만 쓴다: 접속 주소에 그대로 들어간다)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 채우세요}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 컨테이너 밖에서 flask run으로 개발할 때 접속용 (내 PC에서만 열림)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy} -d ${POSTGRES_DB:-pharmacy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      # .env의 DATABASE_URL(localhost)을 컨테이너 안에서는 db 서비스로 바꿔 쓴다
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./var:/app/var          # 업로드 이미지 (DB에는 storage_key만)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
